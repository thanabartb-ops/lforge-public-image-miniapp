name: LFORGE Mini App Validation

on:
  push:
    branches: [main, 'lforge/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Mini App
        run: node scripts/validate-miniapp.mjs
